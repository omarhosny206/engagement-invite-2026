<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f1e5">
  <meta name="description" content="دعوة لخطوبتنا يوم الجمعة ٣٠ أكتوبر ٢٠٢٦ الساعة ٦ مساءً في Katameya Gardens Club">
  <meta property="og:title" content="دعوة خطوبتنا | ٣٠ أكتوبر ٢٠٢٦">
  <meta property="og:description" content="مستنيينكم في خطوبتنا يوم ٣٠ أكتوبر ٢٠٢٦ الساعة ٦ مساءً.">
  <meta property="og:type" content="website">
  <title>دعوة خطوبتنا | ٣٠ أكتوبر ٢٠٢٦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page">
    <main id="top">
      <section class="hero" aria-label="ظرف الدعوة">
        <div class="hero__scene">

          <div class="envelope-stage" id="envelopeStage">
            <div class="envelope-stage__shadow" aria-hidden="true"></div>
            <div class="envelope" aria-hidden="true">
              <div class="envelope__back"></div>
              <div class="envelope__letter">
                <span>دعوة ليكم</span>
                <strong>خطوبتنا</strong>
                <small>٣٠ أكتوبر ♥</small>
              </div>
              <div class="envelope__flap"><img class="envelope__floral envelope__floral--top" src="floral.svg" alt=""></div>
              <div class="envelope__left"></div>
              <div class="envelope__right"></div>
              <div class="envelope__bottom"><img class="envelope__floral envelope__floral--bottom" src="floral.svg" alt=""></div>
            </div>
            <a class="wax-seal" id="openButton" href="#invitation" aria-label="افتحوا الظرف واقرأوا الدعوة" aria-controls="invitation" aria-expanded="false"><span class="seal-ripple" aria-hidden="true"></span><span class="wax-seal__mark" aria-hidden="true"><span>ع</span><span class="wax-seal__heart">♥</span><span>س</span></span></a>
            <span class="open-cue" aria-hidden="true"><span>اضغطوا على الختم</span><svg viewBox="0 0 66 45" fill="none"><path d="M61 5C54 28 41 36 8 36m0 0 13-11M8 36l13 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </div>
        </div>
      </section>

      <section class="invitation" id="invitation" aria-labelledby="invitation-title">
        <div class="invitation__paper">
          <figure class="paper-photo"><img src="us-cutout.png" alt="صورتنا وإحنا صغيرين" width="1084" height="1451"></figure>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="تفعيل الوضع الداكن">☾</button>
          <img class="floral floral--card-top" src="floral.svg" alt="" aria-hidden="true">
          <img class="floral floral--card-bottom" src="floral.svg" alt="" aria-hidden="true">
          <img class="floral floral--card-top-left" src="floral.svg" alt="" aria-hidden="true">
          <img class="floral floral--card-bottom-right" src="floral.svg" alt="" aria-hidden="true">
          <div class="flying-flowers" aria-hidden="true">
            <span style="--x:4%;--delay:-1s;--duration:11s;--drift:18px;--spin:240deg">❀</span>
            <span style="--x:94%;--delay:-6s;--duration:13s;--drift:-24px;--spin:-280deg">✿</span>
            <span style="--x:9%;--delay:-4s;--duration:14s;--drift:12px;--spin:310deg">✿</span>
            <span style="--x:97%;--delay:-9s;--duration:12s;--drift:-15px;--spin:-220deg">❀</span>
            <span style="--x:2%;--delay:-8s;--duration:15s;--drift:22px;--spin:360deg">❀</span>
            <span style="--x:90%;--delay:-2s;--duration:10s;--drift:-18px;--spin:-260deg">✿</span>
            <span style="--x:7%;--delay:-11s;--duration:16s;--drift:14px;--spin:220deg">✿</span>
            <span style="--x:96%;--delay:-4s;--duration:17s;--drift:-26px;--spin:-310deg">❀</span>
          </div>
          <div class="invitation__content">
            <p class="eyebrow eyebrow--olive">دعوة من قلبنا</p>
            <h1 class="invitation__title" id="invitation-title" tabindex="-1">مستنيينكم في خطوبتنا</h1>
            <div class="names" aria-label="عمر وسماء">
              <span>عمر</span><span class="names__and">و</span><span>سماء</span>
            </div>
            <div class="date-card">
              <span class="date-card__label">احفظوا التاريخ</span>
              <strong>الجمعة، ٣٠ أكتوبر ٢٠٢٦</strong>
              <time datetime="18:00">الساعة ٦:٠٠ مساءً</time>
            </div>
            <div class="venue">
              <span class="venue__icon" aria-hidden="true">⌖</span>
              <div>
                <span class="venue__label">نتقابل في</span>
                <strong>Katameya Gardens Club</strong>
                <span>Outdoor Garden Hall</span>
              </div>
            </div>
            <a class="map-button" href="https://maps.app.goo.gl/Y8P62KcBgoT3cKH67?g_st=iw" target="_blank" rel="noopener noreferrer" aria-label="افتحوا موقع Katameya Gardens Club على الخريطة">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s7-6.1 7-12A7 7 0 1 0 5 9c0 5.9 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
              افتحوا اللوكيشن
            </a>
            <div class="divider" aria-hidden="true"><span>♥</span></div>
            <p class="invitation__closing">وجودكم معانا هيفرّحنا بجد.</p>
          </div>
        </div>
      </section>
    </main>

  </div>
</body>
</html>
